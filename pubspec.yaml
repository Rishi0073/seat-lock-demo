name: seat_lock_demo
description: A Flutter demo of movie seat booking with a Redis-style seat lock (NX + 10-minute expiry) that prevents race-condition double bookings.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
